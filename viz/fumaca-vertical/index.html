<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cigarro × vape por estado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --gnd:#EFEFEC; --ink:#15161A;
  --hair:rgba(21,22,26,.28); --hair2:rgba(21,22,26,.13); --key:rgba(21,22,26,.52);
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#F5F5F3 0%,#EAEAE7 100%) fixed;
  color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.k{font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key)}
.bar{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:28px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);font-size:9px;letter-spacing:.17em;
  text-transform:uppercase;font-weight:500;transition:background .13s,color .13s;white-space:nowrap}
.pill:hover{background:rgba(21,22,26,.07)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--gnd)}
.pill.small{height:23px;padding:0 10px;font-size:8px;border-color:var(--hair)}
.pill.small[aria-pressed=true]{border-color:var(--ink)}
.toggle{display:flex;gap:7px;align-items:center;font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--key);cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--ink);margin:0}
.note{font-size:9px;letter-spacing:.05em;line-height:1.75;color:var(--key);margin:8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* the chart owns the full height; the controls sit beside it */
.app{height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:20px;padding:0 20px}
.side{align-self:center;max-height:100dvh;overflow-y:auto;scrollbar-width:none;padding:18px 0;
  display:flex;flex-direction:column;gap:20px}
.side::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;gap:8px}
#groups{flex-direction:column;align-items:stretch}
#groups .pill{text-align:left;display:inline-flex;align-items:center;gap:9px}
#groups .pill svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center;padding:14px 0}
.stage canvas{display:block;box-shadow:0 14px 40px rgba(21,22,26,.22);border-radius:2px;touch-action:manipulation}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--gnd);font-size:10.5px;letter-spacing:.04em;
  padding:9px 11px;border-radius:4px;white-space:nowrap;display:none;z-index:9;line-height:1.7}
.tip b{font-weight:500}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* with room to spare, an empty column the width of the controls on the right
   puts the chart in the middle of the page rather than the middle of what is left */
@media (min-width:1100px){
  .app{grid-template-columns:210px minmax(0,1fr) 210px}
}
/* narrow screens: a compact strip on top, the chart takes the rest of the height */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:0 10px;column-gap:0}
  .side{align-self:auto;max-height:none;overflow:visible;padding:10px 0 0;gap:8px;min-width:0}
  .grp{min-width:0}
  .grp{flex-direction:row;align-items:center;gap:8px}
  .grp>.k{display:none}
  #groups{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #groups::-webkit-scrollbar{display:none}
  .opts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  .stage{padding:10px 0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Controles">
    <div class="grp"><span class="k">Grupo</span><div class="bar" id="groups" role="group" aria-label="Grupo"></div></div>
    <div class="opts grp" style="gap:16px">
      <div class="grp"><span class="k">Maior no topo</span>
        <div class="bar" id="sorts" role="group" aria-label="Maior no topo">
          <button class="pill small" data-sort="diff" type="button">Diferença</button>
          <button class="pill small" data-sort="v" type="button">Vape</button>
          <button class="pill small" data-sort="c" type="button">Cigarro</button>
          <button class="pill small" data-sort="max" type="button">Vape ou cigarro</button>
        </div></div>
    </div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="art" role="img"></canvas>
    <div class="tip" id="tip"></div>
    <p class="sr" id="summary" aria-live="polite"></p>
  </main>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   Helpers, noise and textures (from the Datagrain studio)
============================================================ */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const fadeQ=t=>t*t*(3-2*t);
function hashi(x,y,z,s){
  let n=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(z|0,1440662683)^Math.imul(s|0,1013904223);
  n=Math.imul(n^(n>>>15),2246822519); n=Math.imul(n^(n>>>13),3266489917); n^=n>>>16;
  return (n>>>0)/4294967296;
}
function vn(x,y,s){
  const xi=Math.floor(x),yi=Math.floor(y),u=fadeQ(x-xi),v=fadeQ(y-yi);
  const a=hashi(xi,yi,0,s),b=hashi(xi+1,yi,0,s),c=hashi(xi,yi+1,0,s),d=hashi(xi+1,yi+1,0,s);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function fbm(x,y,s,oct){ let sum=0,a=.5,f=1,nm=0; for(let i=0;i<oct;i++){ sum+=a*vn(x*f,y*f,s+i*57); nm+=a; a*=.5; f*=2; } return sum/nm; }
function rng(s){ let a=(s>>>0)||1; return ()=>{ a^=a<<13;a>>>=0;a^=a>>>17;a^=a<<5;a>>>=0; return a/4294967296; }; }
function hex2rgb(h){ h=String(h).replace("#",""); const n=parseInt(h,16)||0; return [(n>>16)&255,(n>>8)&255,n&255]; }
const rgb2hex=(r,g,b)=>"#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("");
const mixHex=(a,b,t)=>{ const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t)); };
const tint=(h,t)=>t>=0?mixHex(h,"#ffffff",Math.min(1,t)):mixHex(h,"#000000",Math.min(1,-t)*.9);
const lum=h=>{ const [r,g,b]=hex2rgb(h); return r*.299+g*.587+b*.114; };
const byLum=a=>a.slice().sort((p,q)=>lum(p)-lum(q));
const canvasOf=(w,h)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; };
const nf=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});

/* Visual themes. The subject is teenagers' use of cigarettes and vapes, so the
   default stays sober: no candy colours that echo vape packaging, no starry sky.
   Warm (tobacco) against cool (vapour) also reads apart for colour-blind readers. */
const THEMES={
  // tobacco: warm greys with a brown cast; vapour: slate-indigo down to a pale mist
  caderno:{id:"caderno", name:"Caderno", ground:"#F3F1EA", text:"#1E1D1B", grid:"#B9CCDD", stars:false,
    groundInks:["#ECE9E1","#E3DFD5","#D8D3C7"], groundAlpha:.4, grain:.22,
    inkC:["#7A6E64","#9E9286","#C2B8AC","#E3DCD2"], inkV:["#5A6B8E","#8090B0","#A9B6CE","#D2D9E7"], vape:"vapor",
    lineC:"#7C4E2C", lineV:"#34456E"}
};
let T=THEMES.caderno;
let SEED=7;

/* Delta's silt field: warped fBm with a ridged pass, through a bleached ramp */
function texSmoke(W,H,inks,seed,o={}){
  const long=Math.max(W,H), res=clamp(Math.round(long/3),60,420);
  const fw=Math.max(2,Math.round(res*W/long)), fh=Math.max(2,Math.round(res*H/long));
  const buf=canvasOf(fw,fh), bc=buf.getContext("2d"), img=bc.createImageData(fw,fh), d=img.data;
  const pal=byLum(inks), mix=.22, stops=[hex2rgb(tint(pal[0],o.dark??-.55))];
  pal.forEach(h=>{ const [r,g,b]=hex2rgb(h), gr=70+150*lum(h)/255; stops.push([r*(1-mix)+gr*mix,g*(1-mix)+gr*mix,b*(1-mix)+gr*mix]); });
  stops.push(hex2rgb(tint(pal[pal.length-1],o.light??.45)));
  const n=stops.length-1, sc=5, wp=.9, ct=o.contrast??1.38;
  for(let y=0;y<fh;y++) for(let x=0;x<fw;x++){
    // stretched upward, so the smoke reads as rising rather than pooling
    const u=x/fh*sc*1.5, v=y/fh*sc*.5;
    const wx=u+wp*(fbm(u*1.7+11,v*1.7,seed+91,3)-.5)*2.4;
    const wy=v+wp*(fbm(u*1.7,v*1.7+7,seed+37,3)-.5)*2.4;
    let t=fbm(wx,wy,seed,5);
    const rg=1-Math.abs(fbm(wx*2.1+5,wy*2.1-3,seed+211,3)*2-1);
    t=clamp((t*.74+rg*rg*.26-.5)*ct+.5,0,1);
    const p=t*n, i=Math.min(n-1,Math.floor(p)), m=p-i, A=stops[i], B=stops[i+1], o=(y*fw+x)*4;
    d[o]=lerp(A[0],B[0],m); d[o+1]=lerp(A[1],B[1],m); d[o+2]=lerp(A[2],B[2],m); d[o+3]=255;
  }
  bc.putImageData(img,0,0);
  const out=canvasOf(W,H), oc=out.getContext("2d");
  oc.imageSmoothingEnabled=true; oc.imageSmoothingQuality="high"; oc.drawImage(buf,0,0,W,H);
  return out;
}
/* Delta's mosaic: dark base, cells dealt from a slow field, clashing strays, fine patches */
function texPixels(W,H,inks,seed){
  const U=Math.sqrt(W*H), u=Math.max(2,Math.round(U*.016));
  const out=canvasOf(W,H), c=out.getContext("2d"), pal=byLum(inks), n=pal.length, dens=.78;
  c.fillStyle=tint(pal[0],-.55); c.fillRect(0,0,W,H);
  for(let y=0,cy=0;y<H;y+=u,cy++) for(let x=0,cx=0;x<W;x+=u,cx++){
    const f=clamp((fbm(cx/10,cy/14,seed,3)-.5)*1.9+.5,0,.999), h=hashi(cx,cy,1,seed);
    let col=null;
    if(h<dens) col=pal[Math.floor(f*n)];
    else if(h<dens+(1-dens)*.3) col=pal[Math.floor(hashi(cx,cy,2,seed)*n)];
    if(col){ c.fillStyle=col; c.fillRect(x,y,u,u); }
  }
  const r=rng(seed+5), fu=Math.max(2,Math.round(u*.5));
  for(let q=0;q<12;q++){
    const pw=Math.round((4+r()*12)*fu), ph=Math.round((4+r()*14)*fu);
    const px=Math.round(r()*W/fu)*fu, py=Math.round(r()*H/fu)*fu;
    const local=pal.slice().sort(()=>r()-.5).slice(0,2+((r()*2)|0));
    for(let y=py;y<py+ph;y+=fu) for(let x=px;x<px+pw;x+=fu){
      if(r()>.85) continue;
      c.fillStyle=local[(r()*local.length)|0]; c.fillRect(x,y,fu,fu);
    }
  }
  return out;
}
/* vapour: a smoke field read at coarse cells and cut to a few tones of one hue,
   a cloud drawn in pixels rather than a confetti of colours */
function texVapor(W,H,inks,seed){
  const U=Math.sqrt(W*H), u=Math.max(2,Math.round(U*.0072));
  const cw=Math.ceil(W/u), ch=Math.ceil(H/u);
  const field=texSmoke(cw,ch,["#000000","#555555","#AAAAAA","#FFFFFF"],seed);
  const src=field.getContext("2d").getImageData(0,0,cw,ch).data;
  const pal=byLum(inks).map(hex2rgb), n=pal.length;
  const small=canvasOf(cw,ch), sc=small.getContext("2d"), img=sc.createImageData(cw,ch), d=img.data;
  for(let k=0;k<cw*ch;k++){
    // a touch of ordered dither so the tone steps read as pixels, not bands
    const x=k%cw, y=(k/cw)|0, bay=((x&1)*2+((y&1)^(x&1)))/4-.375;
    const l=clamp(src[k*4]/255+bay*.1,0,.999), c=pal[Math.floor(l*n)];
    d[k*4]=c[0]; d[k*4+1]=c[1]; d[k*4+2]=c[2]; d[k*4+3]=255;
  }
  sc.putImageData(img,0,0);
  const out=canvasOf(W,H), oc=out.getContext("2d");
  oc.imageSmoothingEnabled=false; oc.drawImage(small,0,0,cw*u,ch*u);
  return out;
}
const texCig=(W,H)=>texSmoke(W,H,T.inkC,SEED*31+1,{dark:-.12,light:.55,contrast:1.12});
const texVape=(W,H)=>T.vape==="pixels"?texPixels(W,H,T.inkV,SEED*31+2):texVapor(W,H,T.inkV,SEED*31+2);
/* the grain as its own overlay layer, so it costs nothing per animation frame */
function grainLayer(W,H){
  const out=canvasOf(W,H), c=out.getContext("2d"), img=c.createImageData(W,H), d=img.data;
  const U=Math.sqrt(W*H), gsc=Math.max(1,U/640), cs=11*gsc;
  for(let y=0,i=0;y<H;y++){
    const gy=(y/gsc)|0;
    for(let x=0;x<W;x++,i+=4){
      const gx=(x/gsc)|0, h=hashi(gx,gy,3,7), cl=vn(gx*gsc/cs,y/cs,41);

      if(h>.986) g=255;
      d[i]=d[i+1]=d[i+2]=g; d[i+3]=255;
    }
  }
  c.putImageData(img,0,0);
  return out;
}

const DATA={}, NAMES={};
CSV.trim().split("\n").slice(1).forEach(line=>{
  const [g,,uf,sig,,serie,val,lo,hi]=line.split(",");
  const v=parseFloat(val), l=parseFloat(lo), h=parseFloat(hi);
  (DATA[g]||(DATA[g]={}));
  const e=DATA[g][sig]||(DATA[g][sig]={sig});
  NAMES[sig]=uf;
  if(/cig/i.test(serie)){ e.c=v; e.cl=l; e.ch=h; } else { e.v=v; e.vl=l; e.vh=h; }
});
const GROUPS=["Total","Meninas","Meninos","Escola pública","Escola privada"].filter(g=>DATA[g]);
const STATES=Object.keys(DATA[GROUPS[0]]);
// one scale for every group, so switching compares like with like
const MAX=Math.ceil(Math.max(...GROUPS.flatMap(g=>Object.values(DATA[g]).flatMap(e=>[e.c,e.v,e.ch,e.vh])))/10)*10;
const N=STATES.length;

/* ============================================================
   State and the transition between groups
============================================================ */
let group="Total", sortBy="diff", showCI=false;
const metric={diff:e=>e.v-e.c, v:e=>e.v, c:e=>e.c, max:e=>Math.max(e.v,e.c)};
const FIELDS=["c","v","cl","ch","vl","vh"];
function target(){
  const d=DATA[group];
  const list=STATES.slice().sort((a,b)=>metric[sortBy](d[a])-metric[sortBy](d[b]));   // biggest last, so on top
  const t={}; list.forEach((s,i)=>{ t[s]={pos:i}; FIELDS.forEach(f=>t[s][f]=d[s][f]); });
  return t;
}
let cur=target(), from=null, to=null, t0=0, anim=0;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function go(){
  from=JSON.parse(JSON.stringify(cur)); to=target(); t0=performance.now();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ cur=to; draw(); return; }
  cancelAnimationFrame(anim);
  const step=now=>{
    const k=ease(clamp((now-t0)/850,0,1));
    STATES.forEach(s=>{ cur[s]={pos:lerp(from[s].pos,to[s].pos,k)}; FIELDS.forEach(f=>cur[s][f]=lerp(from[s][f],to[s][f],k)); });
    draw(k<1);
    if(k<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}

/* ============================================================
   The shape: a value at any height. Each state is a flat band at its own
   value; bands blend over a short ease with their neighbours, and while
   states trade places the blend carries them past each other.
============================================================ */
const PLATEAU=.28, REACH=.72;
function valueAt(s,f){
  let sw=0, sv=0;
  for(const k of STATES){
    const d=Math.abs(s-cur[k].pos); if(d>=REACH) continue;
    const w=d<=PLATEAU?1:1-smooth(PLATEAU,REACH,d);
    sw+=w; sv+=w*cur[k][f];
  }
  if(sw>0) return sv/sw;
  // beyond the end bands: hold the nearest one
  let best=STATES[0]; for(const k of STATES) if(Math.abs(s-cur[k].pos)<Math.abs(s-cur[best].pos)) best=k;
  return cur[best][f];
}

  const U=Math.sqrt(W*H);
  // the plot starts below the title block: legend line, then a clear line for the scale
  const fsS0=Math.max(7,U*.0165), bot=H*.835, src=H*.905;
  const top=Math.max(H*.13, H*.055+fsS0*5.4+(bot-H*.15)/N*.55);
  // the left margin fits the longest state name at the size it will be drawn
  const fs=Math.max(8,Math.min((bot-top)/N*.62,U*.022));
  c.font=`500 ${fs}px "DM Mono", ui-monospace, monospace`;
  let longest=Math.max(...STATES.map(s=>c.measureText(s==="BR"?"BRASIL":NAMES[s]).width));
  const short=longest>W*.28;
  if(short) longest=Math.max(...STATES.map(s=>c.measureText(s).width));
  const labL=Math.max(W*.16,longest+U*.045), labR=Math.max(W*.11,c.measureText("+00,0").width+U*.05);
  const x0=labL, x1=W-labR, cx=(x0+x1)/2, half=(x1-x0)/2*.97;
  const rowH=(bot-top)/N;
  // the two objects at true-ish proportions: a cigarette about 11:1, a pod twice its thickness;
  // the vape's pixel is the vapour texture's pixel, so it sits on the same grid
  const u=Math.max(2,Math.round(U*.0072)), vcols=Math.round(U*.17/u);
  const obj={len:U*.18,d:U*.0165,gap:U*.007,u,vcols,vlen:vcols*u};
  const foot=src+u*2.5+Math.max(8,U*.0175)*1.5;
  return {W,H,U,top,bot,src,x0,x1,cx,half,rowH,short,obj,foot,
    yOf:p=>bot-(p+.5)*rowH, sOf:y=>(bot-y)/rowH-.5, X:v=>v/MAX*half};
}
function render(c,W,H,final){
  const g=geom(W,H,c), {U,cx,top,bot,src,rowH,X}=g;
  const font=(px,w)=>`${w||400} ${px}px "DM Mono", ui-monospace, monospace`;
  const fs=Math.max(8,Math.min(rowH*.62,U*.022)), fsS=Math.max(7,U*.0165);

  c.fillStyle=T.ground; c.fillRect(0,0,W,H);
  // a faint smoke over the whole ground, and stars
  c.globalAlpha=T.groundAlpha; c.drawImage(cached(`g|${T.id}|${W}|${H}|${SEED}`,()=>texSmoke(W,H,T.groundInks,SEED*31+9)),0,0); c.globalAlpha=1;
  if(T.grid){
    // a squared exercise-book page, kept faint
    const sq=Math.max(6,U*.024);
    c.strokeStyle=T.grid; c.globalAlpha=.45; c.lineWidth=Math.max(.5,U*.0007);
    c.beginPath();
    for(let x=sq*.5;x<W;x+=sq){ c.moveTo(Math.round(x)+.5,0); c.lineTo(Math.round(x)+.5,H); }
    for(let y=sq*.5;y<H;y+=sq){ c.moveTo(0,Math.round(y)+.5); c.lineTo(W,Math.round(y)+.5); }
    c.stroke(); c.globalAlpha=1;
  }
  if(T.stars) for(let k=0;k<420;k++){
    const x=hashi(k,11,0,SEED)*W, y=hashi(k,12,0,SEED)*H;
    c.globalAlpha=.3+.6*hashi(k,13,0,SEED); c.fillStyle=T.text;
    c.beginPath(); c.arc(x,y,U*(.0008+hashi(k,15,0,SEED)*.0015),0,TAU); c.fill();
  }
  c.globalAlpha=1;

  // value grid: dashed verticals at round numbers, on both sides of the axis
  const step=MAX>40?10:5;
  c.strokeStyle=mixHex(T.text,T.ground,.78); c.lineWidth=Math.max(1,U*.0009); c.setLineDash([fsS*.3,fsS*.6]);
  for(let v=step;v<=MAX;v+=step) for(const sgn of [-1,1]){ const x=cx+sgn*X(v); c.beginPath(); c.moveTo(x,top-rowH*.3); c.lineTo(x,bot); c.stroke(); }
  c.setLineDash([]);

  // the two halves of the plume: sampled bottom to top, plus a taper down to the source
  const K=Math.max(200,Math.round((bot-top)/1.5));
  const ys=[]; for(let k=0;k<=K;k++) ys.push(top+(bot-top)*k/K);
  const taperN=40, taper=[]; for(let k=1;k<=taperN;k++) taper.push(bot+(src-bot)*k/taperN);
  const edge=(f,y)=>X(valueAt(g.sOf(y),f));
  const bottomW=f=>X(valueAt(-.5,f));
  const taperW=(f,y)=>{ const t=(y-bot)/(src-bot); return bottomW(f)*Math.pow(1-smooth(0,1,t),1.35)+U*.002; };
  const half=(sgn,f)=>{
    const p=new Path2D(); p.moveTo(cx,src); p.lineTo(cx,top);
    for(const y of ys) p.lineTo(cx+sgn*edge(f,y),y);
    for(const y of taper) p.lineTo(cx+sgn*taperW(f,y),y);
    p.closePath(); return p;
  };
  const edgeLine=(sgn,f,withTaper)=>{
    const p=new Path2D(); ys.forEach((y,k)=>{ const x=cx+sgn*edge(f,y); k?p.lineTo(x,y):p.moveTo(x,y); });
    if(withTaper) for(const y of taper) p.lineTo(cx+sgn*taperW(f,y),y);
    return p;
  };
  const L=half(-1,"c"), R=half(1,"v");
  c.save(); c.clip(L); c.drawImage(cached(`c|${T.id}|${W}|${H}|${SEED}`,()=>texCig(W,H)),0,0); c.restore();
  c.save(); c.clip(R); c.drawImage(cached(`v|${T.id}|${W}|${H}|${SEED}`,()=>texVape(W,H)),0,0); c.restore();

  // uncertainty: the interval at each edge, blurred like thinning smoke
  if(showCI){
    c.save(); c.filter=`blur(${(U*.004).toFixed(1)}px)`; c.globalAlpha=.42;
    for(const [sgn,lo,hi,col] of [[-1,"cl","ch",T.lineC],[1,"vl","vh",T.lineV]]){
      const p=new Path2D();
      ys.forEach((y,k)=>{ const x=cx+sgn*edge(hi,y); k?p.lineTo(x,y):p.moveTo(x,y); });
      for(let k=ys.length-1;k>=0;k--) p.lineTo(cx+sgn*edge(lo,ys[k]),ys[k]);
      p.closePath(); c.fillStyle=col; c.fill(p);
    }
    c.restore();
  }

  // the source: a cigarette from the left and a vape from the right, meeting at the axis
  drawSource(c,g);

  // grain, as an overlay layer, over the plume and the objects alike
  c.save(); c.globalCompositeOperation="overlay"; c.globalAlpha=T.grain;
  c.drawImage(cached(`grain|${W}|${H}`,()=>grainLayer(W,H)),0,0); c.restore();

  /* ---- lines and type after the grain ---- */
  c.lineJoin="round";
  c.strokeStyle=T.lineC; c.lineWidth=Math.max(1.2,U*.0024); c.stroke(edgeLine(-1,"c",true));
  c.strokeStyle=T.lineV; c.stroke(edgeLine(1,"v",true));
  // the mirror: where the other side would reach, so what passes it is the difference
  const dash=[U*.009,U*.006], halo=Math.max(3,U*.0065), lw=Math.max(1.4,U*.0026);
  for(const [sgn,f,col] of [[1,"c",T.lineC],[-1,"v",T.lineV]]){
    const pth=edgeLine(sgn,f,true);   // down to the source too, like the solid edges
    c.setLineDash(dash); c.lineCap="butt";
    c.strokeStyle=T.ground; c.globalAlpha=.85; c.lineWidth=halo; c.stroke(pth);
    c.strokeStyle=col; c.globalAlpha=1; c.lineWidth=lw; c.stroke(pth);
  }
  c.setLineDash([]); c.globalAlpha=1;
  c.strokeStyle=mixHex(T.text,T.ground,.5); c.lineWidth=Math.max(1,U*.0011);
  c.beginPath(); c.moveTo(cx,top); c.lineTo(cx,bot); c.stroke();

  drawKey(c,g);

  // the scale across the top
  c.font=font(fsS); c.fillStyle=mixHex(T.text,T.ground,.35); c.textAlign="center"; c.textBaseline="alphabetic";
  for(let v=0;v<=MAX;v+=step*2) for(const sgn of v?[-1,1]:[1]) c.fillText(v+"%",cx+sgn*X(v),top-rowH*.55);
  const cueY=top-rowH*.55-fsS*1.55;
  c.fillStyle=mixHex(T.text,T.ground,.5);
  c.textAlign="right"; c.fillText("← cigarro",cx-U*.012,cueY);
  c.textAlign="left"; c.fillText("vape →",cx+U*.012,cueY);

  // state names on the left, the difference on the right
  c.textBaseline="middle";
  const order=STATES.slice().sort((a,b)=>cur[a].pos-cur[b].pos);
  for(const s of order){
    const e=cur[s], y=g.yOf(e.pos), ref=s==="BR";
    // a row between places is in motion: its labels thin out until it lands, so crossings stay clean
    const off=Math.abs(e.pos-Math.round(e.pos));
    c.globalAlpha=1-smooth(.04,.3,off)*.88;
    c.font=font(fs,ref?500:400); c.textAlign="right"; c.fillStyle=ref?T.text:mixHex(T.text,T.ground,.28);
    c.fillText(ref?(g.short?"BR":"BRASIL"):(g.short?s:NAMES[s]),g.x0-U*.018,y);
    const d=e.v-e.c;
    c.textAlign="left"; c.font=font(fs,500);
    c.fillStyle=d>=0?T.lineV:T.lineC;
    c.fillText((d>0?"+":d<0?"−":"±")+nf(Math.abs(d)),g.x1+U*.018,y);
    if(ref){
      // the national line: corner marks across the whole row
      const x0=g.x0-U*.01, x1=g.x1+U*.01, y0=y-rowH*.5, y1=y+rowH*.5, k=U*.012;
      c.strokeStyle=T.text; c.lineWidth=Math.max(1,U*.0012); c.beginPath();
      c.moveTo(x0,y0+k);c.lineTo(x0,y0);c.lineTo(x0+k,y0); c.moveTo(x1-k,y0);c.lineTo(x1,y0);c.lineTo(x1,y0+k);
      c.moveTo(x0,y1-k);c.lineTo(x0,y1);c.lineTo(x0+k,y1); c.moveTo(x1-k,y1);c.lineTo(x1,y1);c.lineTo(x1,y1-k); c.stroke();
    }
  }
  c.globalAlpha=1;
  c.textBaseline="alphabetic";
  c.font=font(fsS); c.textAlign="left"; c.fillStyle=mixHex(T.text,T.ground,.35);
  c.fillText("p.p.",g.x1+U*.018,top-rowH*.55);

  // title, legend and source
  c.font=font(Math.max(11,U*.034),500); c.textAlign="left"; c.fillStyle=T.text;
  c.fillText("Cigarro × vape",U*.045,H*.055);
  c.font=font(fsS*1.05); c.fillStyle=mixHex(T.text,T.ground,.3);
  c.fillText(`% de estudantes que já experimentou · ${group}`,U*.045,H*.055+fsS*1.9);
  return g;
}
/* the footer: object names on g.foot, then the key and the source; inside the image so they travel with the PNG */
function drawKey(c,g){
  const {cx,U,W,H,obj}=g, fl=Math.max(8,U*.0175), fk=Math.max(7.5,fl*.92), lh=fk*1.45, sw=fk*2.4, pad=fk*.7;
  const x0=U*.045, ly=g.foot, cig0=cx-obj.gap-obj.len, vape0=Math.ceil((cx+obj.gap)/obj.u)*obj.u;
  // the objects are the legend: each named right under itself, in its own colour
  c.font=`400 ${fl}px "DM Mono", ui-monospace, monospace`; c.textBaseline="alphabetic"; c.textAlign="center";
  c.fillStyle=T.lineC; c.fillText("já fumou cigarro",cig0+obj.len/2,ly);
  c.fillStyle=T.lineV; c.fillText("já usou vape",vape0+obj.vlen/2,ly);
  c.font=`400 ${fk}px "DM Mono", ui-monospace, monospace`; c.textAlign="left";
  const wrap=(text,maxW)=>{
    const lines=[]; let cur="";
    for(const w of text.split(" ")){
      const tryL=cur?cur+" "+w:w; if(c.measureText(tryL).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=tryL; }
    if(cur) lines.push(cur); return lines;
  };
  const KEY="Tracejado: espelha o outro lado para comparação.";
  const SRC="Fonte: IBGE, PeNSE 2024"+(showCI?" · faixas: intervalo de 95%":"");
  // one row under the object names: the key on the left, the source on the right, on one baseline;
  // when both don't fit, the source moves to its own line below
  const srcW=c.measureText(SRC).width, room=W-x0-U*.03-sw-pad;
  const together=room-srcW-fk*2>=c.measureText(KEY).width;
  const lines=wrap(KEY,together?room-srcW-fk*2:room), y0=ly+lh*1.6;
  // the sample: both dashes, each in its own colour, drawn as on the chart
  const dash=[U*.009,U*.006];
  [[T.lineC,-fk*.3],[T.lineV,fk*.3]].forEach(([col,dy])=>{
    const yy=y0-fk*.35+dy;
    c.setLineDash(dash); c.lineCap="butt";
    c.strokeStyle=T.ground; c.lineWidth=Math.max(3,U*.0065); c.beginPath(); c.moveTo(x0,yy); c.lineTo(x0+sw,yy); c.stroke();
    c.strokeStyle=col; c.lineWidth=Math.max(1.4,U*.0026); c.beginPath(); c.moveTo(x0,yy); c.lineTo(x0+sw,yy); c.stroke();
  });
  c.setLineDash([]);
  c.fillStyle=mixHex(T.text,T.ground,.3);
  lines.forEach((l,i)=>c.fillText(l,x0+sw+pad,y0+i*lh));
  c.fillStyle=mixHex(T.text,T.ground,.45); c.textAlign="right";
  c.fillText(SRC,W-U*.03,together?y0+(lines.length-1)*lh:y0+lines.length*lh);
}
/* a pixel sprite: f(i,j) gives the colour of cell i,j (or nothing); edges snap to whole device pixels */
function sprite(c,x0,y0,p,cols,rows,f){
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const col=f(i,j); if(!col) continue;
    const xa=Math.round(x0+i*p), ya=Math.round(y0+j*p);
    c.fillStyle=col; c.fillRect(xa,ya,Math.round(x0+(i+1)*p)-xa,Math.round(y0+(j+1)*p)-ya);
  }
}
/* the source: each object is made of the same stuff as its plume. The cigarette is soft and drawn,
   with ash cut from the smoke texture; the vape is built from the vapour's own pixels, on its grid. */
function drawSource(c,g){
  drawCigarette(c,g);
  drawVape(c,g);
}
function drawCigarette(c,g){
  const {U,obj}=g, {len,d,gap}=obj, x1=g.cx-gap, x0=x1-len, y=g.src-d/2;
  const fw=len*.3, aw=len*.055, ax=x1-aw, lw=Math.max(1,U*.0011);
  // shading across the cylinder, the same for filter and paper
  const shade=(a,b,c2,d2)=>{ const gr=c.createLinearGradient(0,y,0,y+d);
    gr.addColorStop(0,a); gr.addColorStop(.28,b); gr.addColorStop(.62,c2); gr.addColorStop(1,d2); return gr; };
  c.save();
  c.fillStyle=shade("#E7E2D7","#FBF9F4","#F1EDE5","#CFC7B8"); c.fillRect(x0+fw,y,ax-x0-fw,d);
  c.fillStyle=shade("#B97542","#DDA470","#C9834C","#97582D"); c.fillRect(x0,y,fw,d);
  // cork speckle on the filter
  c.beginPath(); c.rect(x0,y,fw,d); c.clip();
  for(let k=0;k<70;k++){
    const r=hashi(k,1,9,SEED);
    c.globalAlpha=.35+.35*hashi(k,2,9,SEED); c.fillStyle=r<.5?"#EDC193":"#8A4F27";
    c.fillRect(x0+hashi(k,3,9,SEED)*fw,y+hashi(k,4,9,SEED)*d,U*.0016,U*.0016);
  }
  c.restore();
  // tipping-paper seam, and the paper browning just before the ash
  c.strokeStyle="#B9925D"; c.lineWidth=lw; c.beginPath(); c.moveTo(x0+fw,y); c.lineTo(x0+fw,y+d); c.stroke();
  const burn=c.createLinearGradient(ax-d*.9,0,ax,0);
  burn.addColorStop(0,"rgba(140,105,70,0)"); burn.addColorStop(1,"rgba(110,80,55,.55)");
  c.fillStyle=burn; c.fillRect(ax-d*.9,y,d*.9,d);
  // the ash: a ragged end cut from the cigarette smoke texture itself, a dim ember along its edge
  const ash=new Path2D(); ash.moveTo(ax,y);
  const steps=6;
  for(let k=0;k<=steps;k++) ash.lineTo(x1-aw*.35*hashi(k,5,9,SEED),y+d*k/steps);
  ash.lineTo(ax,y+d); ash.closePath();
  c.save(); c.clip(ash);
  c.drawImage(cached(`c|${T.id}|${g.W}|${g.H}|${SEED}`,()=>texCig(g.W,g.H)),0,0);
  const ag=c.createLinearGradient(0,y,0,y+d); ag.addColorStop(0,"rgba(255,255,255,.15)"); ag.addColorStop(1,"rgba(60,50,45,.35)");
  c.fillStyle=ag; c.fillRect(ax,y,aw,d);
  c.restore();
  c.save();
  c.shadowColor="rgba(196,86,47,.55)"; c.shadowBlur=U*.008;
  c.strokeStyle="#B5482A"; c.lineWidth=Math.max(1.2,d*.16); c.lineJoin="round";
  c.beginPath();
  for(let k=0;k<=steps;k++){ const xx=x1-aw*.35*hashi(k,5,9,SEED)-d*.05, yy=y+d*k/steps; k?c.lineTo(xx,yy):c.moveTo(xx,yy); }
  c.stroke(); c.restore();
  // the outline in the cigarette's own line colour, open at the burning end
  c.strokeStyle=T.lineC; c.lineWidth=lw; c.beginPath();
  c.moveTo(ax,y); c.lineTo(x0,y); c.lineTo(x0,y+d); c.lineTo(ax,y+d); c.stroke();
}
function drawVape(c,g){
  // a slim disposable pod, the kind most teenagers use, in the vapour's palette and pixel size
  const {obj}=g, u=obj.u, n=obj.vcols, R=5, m=4;
  const x0=Math.ceil((g.cx+obj.gap)/u)*u, y0=Math.round((g.src-R*u/2)/u)*u;
  const [ink0,ink1,ink2,ink3]=T.inkV, deep=tint(T.lineV,-.35);
  sprite(c,x0,y0,u,n,R,(i,j)=>{
    if(i<m){
      // mouthpiece: narrower, pale, with a dark opening facing the axis
      if(j<1||j>3) return null;
      if(i===0) return j===2?deep:ink1;
      return j===1?ink3:j===2?ink2:ink1;
    }
    if(i===m) return j===0||j===R-1?null:deep;   // the seam
    if((i===m+1||i===n-1)&&(j===0||j===R-1)) return null;   // rounded corners
    if(i===n-3&&j===2) return ink3;   // the light that comes on with each puff
    if(i===n-1) return j===2?ink1:ink0;
    if(j===0) return ink1;
    if(j===1) return ink0;
    if(j===R-1) return deep;
    return T.lineV;
  });
}

/* ---- sizing and drawing ---- */
function size(){
  // always the full height of the stage; the width follows, up to a shape the plume reads well in
  const stage=$("#stage"), cs=getComputedStyle(stage);
  const h=Math.max(320,stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  const w=Math.min(stage.clientWidth,h*.95);
  const dpr=Math.min(2,devicePixelRatio||1);
  art.width=Math.round(w*dpr); art.height=Math.round(h*dpr);
  art.style.width=w+"px"; art.style.height=h+"px";
}
function draw(){
  G=render(art.getContext("2d"),art.width,art.height);
  const top=STATES.slice().sort((a,b)=>cur[b].pos-cur[a].pos).slice(0,3).map(s=>`${NAMES[s]} (cigarro ${nf(cur[s].c)}%, vape ${nf(cur[s].v)}%)`);
  art.setAttribute("aria-label",`Cigarro e vape por estado, ${group}. No topo: ${top.join("; ")}.`);
}

/* ---- hover ---- */
const tip=$("#tip");
art.addEventListener("mousemove",e=>{
  if(!G) return;
  const r=art.getBoundingClientRect(), y=(e.clientY-r.top)/r.height*G.H, s=G.sOf(y);
  if(y<G.top||y>G.bot){ tip.style.display="none"; return; }
  let best=STATES[0]; for(const k of STATES) if(Math.abs(s-cur[k].pos)<Math.abs(s-cur[best].pos)) best=k;
  const d=DATA[group][best], diff=d.v-d.c;
  tip.innerHTML=`<div><b>${NAMES[best]==="BRASIL"?"Brasil":NAMES[best]}</b> · ${group}</div>`+
    `<div><i style="background:${T.lineC}"></i>Cigarro: ${nf(d.c)}% (${nf(d.cl)}–${nf(d.ch)})</div>`+
    `<div><i style="background:${T.lineV}"></i>Vape: ${nf(d.v)}% (${nf(d.vl)}–${nf(d.vh)})</div>`+
    `<div>${diff===0?"Empate":(diff>0?"Vape":"Cigarro")+" à frente por "+nf(Math.abs(diff))+" p.p."}</div>`;
  tip.style.display="block";
  const sr=$("#stage").getBoundingClientRect();
  let x=e.clientX-sr.left+16; const yy=e.clientY-sr.top+14;
  if(x+tip.offsetWidth>sr.width) x=e.clientX-sr.left-tip.offsetWidth-12;
  tip.style.left=x+"px"; tip.style.top=yy+"px";
});
art.addEventListener("mouseleave",()=>{ tip.style.display="none"; });

function sync(){
  gHost.querySelectorAll(".pill").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g===group)));
  document.querySelectorAll("#sorts .pill").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sort===sortBy)));
  $("#summary").textContent=`Mostrando ${group}, maior ${sortBy==="diff"?"diferença":sortBy==="v"?"uso de vape":sortBy==="c"?"uso de cigarro":"uso de vape ou cigarro"} no topo.`;
}
let rz=0;
addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ size(); draw(); },120); });
sync();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ size(); draw(); });
})();
</script>
</body>
