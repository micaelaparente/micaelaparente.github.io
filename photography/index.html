<dialog class="lb" id="lb" aria-label="Photo viewer">
  <div class="lb-wrap">
    <div class="lb-img"><img id="lbImg" alt=""></div>
    <div class="lb-meta">
      <span id="lbAlt"></span>
      <a class="redlink" id="lbLink" href="#" target="_blank" rel="noopener">view on unsplash <span>↗</span></a>
    </div>
  </div>
  <span class="label count" id="lbCount"></span>
  <button class="close" id="lbClose" aria-label="Close">×</button>
  <button class="prev" id="lbPrev" aria-label="Previous photo">←</button>
  <button class="next" id="lbNext" aria-label="Next photo">→</button>
</dialog>

<script>
  const items = [...document.querySelectorAll("#gallery a")];
  const lb = document.getElementById("lb"), img = document.getElementById("lbImg");
  const alt = document.getElementById("lbAlt"), link = document.getElementById("lbLink"), count = document.getElementById("lbCount");
  let cur = 0;
  function show(i) {
    cur = (i + items.length) % items.length;
    const a = items[cur], t = a.querySelector("img");
    img.src = a.getAttribute("href");
    img.alt = t.alt;
    alt.textContent = t.alt;
    count.textContent = `${cur + 1} / ${items.length}`;
    const u = a.dataset.unsplash;
    link.hidden = !u;
    if (u) link.href = "https://unsplash.com/photos/" + u;
    const n = items[(cur + 1) % items.length]; new Image().src = n.getAttribute("href"); // preload next
  }
  items.forEach((a, i) => a.addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); show(i); lb.showModal();
  }));
  document.getElementById("lbClose").onclick = () => lb.close();
  document.getElementById("lbPrev").onclick = () => show(cur - 1);
  document.getElementById("lbNext").onclick = () => show(cur + 1);
  lb.addEventListener("click", e => { if (e.target.classList.contains("lb-img") || e.target.classList.contains("lb-wrap")) lb.close(); });
  lb.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") show(cur + 1);
    if (e.key === "ArrowLeft") show(cur - 1);
  });
  lb.addEventListener("close", () => items[cur].focus());
  // swipe on touch screens
  let x0 = null;
  lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });
</script>
